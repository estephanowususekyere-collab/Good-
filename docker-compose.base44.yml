services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monarch
      POSTGRES_PASSWORD: monarch
      POSTGRES_DB: monarch
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarch"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

  migrate:
    build: ./server
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://monarch:monarch@db:5432/monarch
    command: ["sh", "-ec", "npm install && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx src/seed.ts"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build: ./server
    working_dir: /app
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - uploads:/app/uploads
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://monarch:monarch@db:5432/monarch
      - PORT=4000
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
    command: ["sh", "-ec", "npm install && npx prisma generate && exec npx tsx watch src/index.ts"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

  client:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://server:4000
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  db_data:
  server_node_modules:
  client_node_modules:
  uploads:
